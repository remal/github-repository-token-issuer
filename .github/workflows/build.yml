name: build

on:
  push:
    branches:
    - main
  pull_request: { }
  workflow_dispatch: { }

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-${{github.ref}}
  cancel-in-progress: ${{github.ref != 'refs/heads/main'}}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[push-back]') && !contains(github.event.head_commit.message, '[noci]') && !contains(github.event.head_commit.message, '[no-ci]'))
        || github.event_name != 'push'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: GCP - Authenticate
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: projects/74155037973/locations/global/workloadIdentityPools/github-pool/providers/remal-gh-repo-token-issuer
        service_account: gh-remal-gh-repo-token-issuer@gh-repo-token-issuer.iam.gserviceaccount.com

    - name: Terraform - Read version
      id: terraform-version
      run: |
        version="$(tr -d '[:space:]' < .terraform-version)"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
    - name: Terraform - Setup
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{steps.terraform-version.outputs.version}}
    - name: Terraform - Init
      working-directory: ./terraform
      run: terraform init
    - name: Terraform - Validate
      working-directory: ./terraform
      run: terraform validate

    - name: TFLint - Setup
      uses: terraform-linters/setup-tflint@v6
      with:
        tflint_version_file: .tool-versions
    - name: TFLint - Init
      working-directory: ./terraform
      run: tflint --init
      env:
        GITHUB_TOKEN: ${{github.token}}
    - name: TFLint - Run
      working-directory: ./terraform
      run: tflint -f compact

    - name: Terraform - Plan
      working-directory: ./terraform
      run: terraform plan -lock-timeout=5m

    - name: Trivy - Read version
      id: trivy-version
      run: |
        version=$(awk '$1 == "trivy" { print $2 }' .tool-versions)
        if [[ -z "${version}" ]]; then
          echo "::error::No 'trivy <version>' line found in .tool-versions"
          exit 1
        fi
        echo "version=v${version}" | tee -a "${GITHUB_OUTPUT}"
    - name: Trivy - Setup
      uses: aquasecurity/setup-trivy@v0.3.1
      with:
        version: ${{steps.trivy-version.outputs.version}}
        cache: true
    # Terraform + Dockerfile misconfiguration, go.sum vulnerabilities, and
    # secrets, repo-wide. Runs early to fail fast before spending time on the
    # Go build and Docker image steps below. gha-creds-*.json is the live
    # credentials file google-github-actions/auth writes into the workspace
    # for the GCP - Authenticate step above; it's a real secret but not one
    # from this repo, so it's excluded rather than ignored by finding ID.
    - name: Trivy - Scan
      run: trivy fs . --exit-code 1 --ignore-unfixed --scanners vuln,misconfig,secret --skip-dirs terraform/.terraform --skip-files 'gha-creds-*.json'

    - name: Go - Setup
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        cache-dependency-path: function/go.sum
    - name: Go - Build
      working-directory: ./function
      run: go build ./...
    - name: Go - Vet
      working-directory: ./function
      run: go vet ./...
    - name: Go - Lint
      uses: golangci/golangci-lint-action@v9
      with:
        working-directory: function
    - name: Go - Test
      working-directory: ./function
      run: go test -v ./...
      env:
        GITHUB_APP_ID: "1"

    - name: Go - Build image binary
      working-directory: ./function
      env:
        CGO_ENABLED: '0'
        GOOS: linux
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o function .
    - name: Docker - Build image
      working-directory: ./function
      run: docker build -t gh-repo-token-issuer:ci .
    - name: Trivy - Scan image
      run: trivy image gh-repo-token-issuer:ci --exit-code 1 --ignore-unfixed --scanners vuln
    # Passed the scan, so this exact image (not a rebuild) is what deploy pushes.
    - name: Docker - Save image
      run: docker save gh-repo-token-issuer:ci -o /tmp/gh-repo-token-issuer.tar
    - name: Docker - Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: gh-repo-token-issuer-image
        path: /tmp/gh-repo-token-issuer.tar
        retention-days: 1

  deploy:
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
        || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[push-back]') && !contains(github.event.head_commit.message, '[noci]') && !contains(github.event.head_commit.message, '[no-ci]'))
        || github.event_name != 'push'
      }}
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{github.ref == 'refs/heads/main' && 'main' || ''}}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: GCP - Authenticate
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: projects/74155037973/locations/global/workloadIdentityPools/github-pool/providers/remal-gh-repo-token-issuer
        service_account: gh-remal-gh-repo-token-issuer@gh-repo-token-issuer.iam.gserviceaccount.com

    - name: Install gcloud SDK
      uses: google-github-actions/setup-gcloud@v3

    - name: Terraform - Read version
      if: ${{github.ref == 'refs/heads/main'}}
      id: terraform-version
      run: |
        version="$(tr -d '[:space:]' < .terraform-version)"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
    - name: Terraform - Setup
      if: ${{github.ref == 'refs/heads/main'}}
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{steps.terraform-version.outputs.version}}
    - name: Terraform - Init
      if: ${{github.ref == 'refs/heads/main'}}
      working-directory: ./terraform
      run: terraform init
    - name: Terraform - Apply
      if: ${{github.ref == 'refs/heads/main'}}
      working-directory: ./terraform
      run: terraform apply -auto-approve -lock-timeout=5m

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-east4-docker.pkg.dev --quiet

    - name: Docker - Download image artifact
      uses: actions/download-artifact@v8
      with:
        name: gh-repo-token-issuer-image
        path: /tmp

    # Loads the exact image build already scanned, no rebuild.
    - name: Docker - Load and push image
      run: |
        docker load -i /tmp/gh-repo-token-issuer.tar
        SHORT_SHA=$(git rev-parse --short HEAD)
        docker tag gh-repo-token-issuer:ci "us-east4-docker.pkg.dev/gh-repo-token-issuer/gh-repo-token-issuer/function:${SHORT_SHA}"
        docker push "us-east4-docker.pkg.dev/gh-repo-token-issuer/gh-repo-token-issuer/function:${SHORT_SHA}"

    - name: Deploy to Cloud Run (no traffic)
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        gcloud run deploy gh-repo-token-issuer \
          --image="us-east4-docker.pkg.dev/gh-repo-token-issuer/gh-repo-token-issuer/function:${SHORT_SHA}" \
          --region=us-east4 \
          --no-traffic \
          --tag="commit-${SHORT_SHA}"

    - name: Get short SHA
      id: short-sha
      run: |
        value="$(git rev-parse --short HEAD)"
        echo "value=${value}" >> "${GITHUB_OUTPUT}"

    - name: Validate deployed revision
      id: validate
      uses: ./
      with:
        scopes: |
          statuses: write
        service_tag: commit-${{steps.short-sha.outputs.value}}

    - name: Verify token has write access
      run: |
        # Verify statuses:write by creating a commit status
        HTTP_CODE=$(curl -sS -o /tmp/status-response.json -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${{steps.validate.outputs.token}}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{github.repository}}/statuses/${{github.sha}}" \
          -d '{"state":"success","context":"token-validation","description":"Installation token write access verified"}')
        if [[ "${HTTP_CODE}" == "201" ]]; then
          echo "Token validation passed - statuses:write verified"
        else
          echo "Token validation failed (HTTP ${HTTP_CODE}):"
          cat /tmp/status-response.json
          exit 1
        fi

    - name: Migrate traffic to new revision
      if: ${{github.ref == 'refs/heads/main'}}
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        gcloud run services update-traffic gh-repo-token-issuer \
          --region=us-east4 \
          --to-tags="commit-${SHORT_SHA}=100"

    - name: Read project version
      if: ${{github.ref == 'refs/heads/main'}}
      id: project-version
      run: |
        version="$(tr -d '[:space:]' < .version)"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
    - name: Create tag
      if: ${{github.ref == 'refs/heads/main'}}
      uses: remal-github-actions/create-tag@v2
      with:
        tagName: 'v${{steps.project-version.outputs.version}}'
